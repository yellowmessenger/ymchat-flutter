name: Release

# Reproduces this repo's existing manual release process: whenever a push to
# main carries a version in pubspec.yaml that hasn't been tagged yet, tag
# that commit (vX.Y.Z), publish a GitHub Release whose body is the matching
# CHANGELOG.md section, and publish the package to pub.dev. A push to main
# that isn't a release (its pubspec.yaml version is already tagged) is a
# no-op.
#
# Tag/release creation and the pub.dev publish are gated independently: tag+
# release only happen for a not-yet-tagged version, but `dart pub publish`
# is retried on every run (including a manual workflow_dispatch, e.g. to
# recover from a publish failure) as long as that version isn't on pub.dev
# yet.
#
# pub.dev publish uses OIDC "Automated Publishing" — no stored secret. This
# must be enabled once on the package's pub.dev admin page (Admin tab ->
# Automated publishing -> GitHub Actions), specifying this repo and this
# workflow's filename (release.yml), before the publish step will work.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version from pubspec.yaml
        id: version
        run: |
          VERSION="$(sed -n 's/^version:[[:space:]]*\([0-9][^[:space:]]*\).*/\1/p' pubspec.yaml | head -1)"
          if [[ -z "$VERSION" ]]; then
            echo "::error::could not read version from pubspec.yaml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already released
        id: check
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null; then
            echo "already_tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_tagged=false" >> "$GITHUB_OUTPUT"
          fi

          if curl -sf "https://pub.dev/api/packages/ymchat_flutter" | grep -q "\"version\":\"${{ steps.version.outputs.version }}\""; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract CHANGELOG section
        if: steps.check.outputs.already_tagged == 'false'
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES_FILE="$(mktemp)"
          if ! ./scripts/extract_changelog_section.sh "$VERSION" CHANGELOG.md > "$NOTES_FILE"; then
            echo "::error::no CHANGELOG.md section found for $VERSION"
            exit 1
          fi
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: steps.check.outputs.already_tagged == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: steps.check.outputs.already_tagged == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "${{ steps.changelog.outputs.notes_file }}"

      - name: Set up Flutter
        if: steps.check.outputs.already_published == 'false'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Publish to pub.dev
        if: steps.check.outputs.already_published == 'false'
        run: dart pub publish --force
