name: Release

# Reproduces this repo's existing manual release process: whenever a push to
# main carries a version in pubspec.yaml that hasn't been tagged yet, tag
# that commit (vX.Y.Z) and publish a GitHub Release whose body is the
# matching CHANGELOG.md section. A push to main that isn't a release (its
# pubspec.yaml version is already tagged) is a no-op.
#
# Does NOT publish to pub.dev — that's a manual `dart pub publish` step for
# now. (pub.dev's OIDC "Automated Publishing" requires the workflow run
# itself to be triggered by pushing a git tag, which this branch-triggered
# design can't produce, so it fell back to interactive browser OAuth and hung
# in CI. Revisit if/when this is worth a proper fix.)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version from pubspec.yaml
        id: version
        run: |
          VERSION="$(sed -n 's/^version:[[:space:]]*\([0-9][^[:space:]]*\).*/\1/p' pubspec.yaml | head -1)"
          if [[ -z "$VERSION" ]]; then
            echo "::error::could not read version from pubspec.yaml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already released
        id: check
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null; then
            echo "already_tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_tagged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract CHANGELOG section
        if: steps.check.outputs.already_tagged == 'false'
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES_FILE="$(mktemp)"
          if ! ./scripts/extract_changelog_section.sh "$VERSION" CHANGELOG.md > "$NOTES_FILE"; then
            echo "::error::no CHANGELOG.md section found for $VERSION"
            exit 1
          fi
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: steps.check.outputs.already_tagged == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: steps.check.outputs.already_tagged == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "${{ steps.changelog.outputs.notes_file }}"
